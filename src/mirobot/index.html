  <script type="text/javascript">
window.addEventListener('load', function(){
  window.mirobot = new Mirobot();

  // Initialise the simulation control
  var sim = new MirobotSimMenu('#menu', mirobot);
  mirobot.setSimulator(sim);

  // Initialise the fullscreen menu
  var fullscreenMenu = new FullscreenMenu('#menu');

  // Initialise the connectivity menu
  var connMenu = new ConnMenu('#menu', mirobot, {
    connected: "Mirobot Connected",
    error: "Error connecting to Mirobot",
    connecting: "Connecting to Mirobot"
  });

  // Initialise the WiFi config menu. The firmware downloads updates from downloads.mime.co.uk itself.
  var wifiSettings = new ConfigMenu('#menu', mirobot, {deviceChoosesUpdate: true});

  // Initialise the apps menu
  var xobj = new XMLHttpRequest();
  xobj.overrideMimeType("application/json");
  xobj.open('GET', '/a/apps.json', true);
  xobj.onreadystatechange = function () {
    if (xobj.readyState == 4 && xobj.status == "200") {
      new AppsMenu('#menu', JSON.parse(xobj.responseText));
    }
  };
  xobj.send(null);

  // Initialise the app
  if(window.location.search !== ''){
    // Load one of the apps from the filesystem (/a/<id>.js)
    var app = window.location.search.substring(1);
    loadFile('/a/' + app + '.js', 'js', function(res){
      if(res){
        init();
      }else{
        console.log("Error loading script");
        window.location = '/';
      }
    });
  }else{
    // Load the built-in drag and drop UI compiled into the firmware
    loadFile('/BuiltinUI.js', 'js', function(res){
      if(res){
        init();
      }else{
        console.log("Error loading BuiltinUI script");
      }
    });
  }

  mirobot.connect('ws://' + (window.hashConfig['m'] || window.location.hostname) + ':8899/websocket');
});
  </script>
